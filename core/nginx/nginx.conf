# fips-shield main nginx configuration.
#
# Replaces the stock nginx.conf in the container image; host-mode
# installs can use it as-is or fold the load_module line and the two
# include patterns into an existing nginx.conf (see deploy/host/).
#
# Profiles render into /etc/nginx/conf.d as two kinds of files:
#   *.conf    http context  (Phase 1 hardening/limits stage)
#   *.stream  stream context (Phase 2 WebSocket inspection stage)

load_module modules/ngx_stream_js_module.so;

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

error_log /var/log/nginx/error.log warn;

worker_rlimit_nofile 8192;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    include /etc/nginx/conf.d/*.conf;
}

stream {
    include /etc/nginx/conf.d/*.stream;
}
