# fips-shield: surface probing.
# Matches 444 (unknown path, connection closed without response), 403
# (method not in the allowlist) and 405 in the http stage's JSON access
# log.

[Definition]
failregex = ^\{"ts":"[^"]*","src":"<ADDR>","status":(?:444|405|403),
# Only the timestamp is captured: fail2ban removes group 1
# from the line before matching failregex, so capturing the
# JSON prefix too would strip the very text failregex needs.
datepattern = ^\{"ts":"({DATE})
