# fips-shield: surface probing.
# Matches 444 (unknown path, connection closed without response), 403
# (method not in the allowlist) and 405 in the http stage's JSON access
# log.

# 400/408/413/414/494 are added because probing that malforms the
# request — oversize headers, truncated requests, bad request lines —
# used to match nothing at all and so was free. 499 is deliberately
# absent: it means the client went away, which healthy clients do.

[Definition]
failregex = ^\{"ts":"[^"]*","src":"<ADDR>","status":(?:444|405|403|400|408|413|414|494),
# Only the timestamp is captured: fail2ban removes group 1
# from the line before matching failregex, so capturing the
# JSON prefix too would strip the very text failregex needs.
datepattern = ^\{"ts":"({DATE})
