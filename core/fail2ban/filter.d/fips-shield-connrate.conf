# fips-shield: connection-rate refusals from the njs engine.
#
# Split out of fips-shield-verdict so that connection churn and
# message-level abuse can carry different thresholds. Overshooting the
# per-node connection rate is a much weaker signal than a policy
# violation inside an established session: a reconnect loop or a client
# restarting reaches it without malice, and the connection was already
# refused when the verdict was written.
#
# Only the "conn-rate" rule is matched. "banned" is excluded implicitly
# by naming the rule, which keeps enforcement from feeding detection.

[Definition]
failregex = js: shield-verdict \{"ts":"[^"]*","src":"<ADDR>","service":"[^"]*","layer":"access","rule":"conn-rate"
