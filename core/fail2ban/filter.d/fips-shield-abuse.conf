# fips-shield: structural WebSocket abuse from the message engine.
#
# Split out of fips-shield-verdict so that "your client asks for more
# than this relay budgets" and "your client is not speaking WebSocket"
# can carry different thresholds. The rules below cannot be reached by a
# working client talking to a working relay:
#
#   protocol            reserved bits set, unmasked client frame, bad
#                       control frame, continuation without a start,
#                       bare LF in the handshake, drip-fed handshake
#   malformed           not JSON, not a Nostr message, bad event object
#   oversized-message   a frame larger than SHIELD_WS_MAX_MSG
#   oversized-handshake an upgrade request larger than the buffer
#   binary-frame        binary opcode on a text-only protocol
#   frame-flood         a message split into more frames than
#                       SHIELD_WS_MAX_MSG_READS, or a drip-fed message
#   engine-error        the inspector itself threw
#
# Every one of these is either a hand-written client, a scanner, or a
# deliberate attempt to slip past inspection by fragmentation — so this
# jail keeps the low maxretry that fips-shield-verdict used to carry for
# everything (SHIELD_F2B_ABUSE_MAXRETRY).
#
# This list is the POSITIVE half of a complement: fips-shield-verdict
# excludes exactly these names and counts everything else. Adding a rule
# here means removing it from that filter's lookahead, and vice versa.
# test/filters_test.sh asserts every rule name emitted by shield_ws.js
# matches exactly one of the two, so a rule cannot fall through both.
#
# "banned" is excluded implicitly by naming the rules, which keeps
# enforcement from feeding detection.

[Definition]
failregex = js: shield-verdict \{"ts":"[^"]*","src":"<ADDR>","service":"[^"]*","layer":"ws","rule":"(?:protocol|malformed|oversized-message|oversized-handshake|binary-frame|frame-flood|engine-error)"
