# fips-shield: message-level violations from the WebSocket engine.
# Matches shield-verdict JSON lines in the shield error log. The
# "banned" rule is excluded: those lines are enforcement echoes
# (rejected connections from already-banned sources), and feeding them
# back into detection would let a knocking client extend its own ban
# forever.

[Definition]
failregex = js: shield-verdict \{"ts":"[^"]*","src":"<ADDR>","service":"[^"]*","layer":"[^"]*","rule":"(?!banned")
