# fips-shield: message-level violations from the WebSocket engine.
# Matches shield-verdict JSON lines in the shield error log.
#
# Scoped to layer "ws" on purpose. The engine also emits verdicts at
# layer "access" (connection-rate refusals), and those used to be
# counted here against SHIELD_F2B_VERDICT_MAXRETRY — a threshold tuned
# for message violations, where each one already cost the client its
# connection. On the tcp profile that made 13 connections in a minute
# worth an hour's ban doubling toward a week, which an ssh retry loop
# reaches. Connection-rate verdicts now have their own jail
# (fips-shield-connrate) with its own threshold.
#
# The "banned" rule stays excluded: those lines are enforcement echoes
# (rejected connections from already-banned sources), and feeding them
# back into detection would let a knocking client extend its own ban
# forever. The trailing [^"]+" makes the exclusion cover the whole rule
# name, so a future rule named e.g. "banned-mid-session" is not counted
# by accident.

[Definition]
failregex = js: shield-verdict \{"ts":"[^"]*","src":"<ADDR>","service":"[^"]*","layer":"ws","rule":"(?!banned")[^"]+"
