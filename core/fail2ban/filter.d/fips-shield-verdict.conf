# fips-shield: message-level POLICY violations from the WebSocket engine.
# Matches shield-verdict JSON lines in the shield error log.
#
# Scoped to layer "ws" on purpose. The engine also emits verdicts at
# layer "access" (connection-rate refusals), and those used to be
# counted here against SHIELD_F2B_VERDICT_MAXRETRY — a threshold tuned
# for message violations, where each one already cost the client its
# connection. On the tcp profile that made 13 connections in a minute
# worth an hour's ban doubling toward a week, which an ssh retry loop
# reaches. Connection-rate verdicts now have their own jail
# (fips-shield-connrate) with its own threshold.
#
# Scoped again, within layer "ws", to the rules that mean "this client
# asks for more than the relay budgets" rather than "this client is not
# speaking the protocol". A mainstream Nostr client trips the first kind
# without malice: it opens its subscription set in one burst on connect,
# and a follow-list REQ carries one `authors` array as long as the
# user's follow list. Every violation is already fatal to the connection
# (violate() closes with 1008), so the client reconnects and does the
# identical thing again — which made three strikes a ban for a client
# whose only fault was a long follow list. Structural abuse has its own
# jail (fips-shield-abuse) and keeps the low threshold.
#
# The complement is built as a NEGATIVE list: any rule that is not
# `banned` and not in the abuse set is counted here. A rule added to
# shield_ws.js later therefore lands in this jail — detected, but on the
# forgiving threshold — instead of matching no filter at all and
# shipping dead. Keep this list and fips-shield-abuse.conf's exactly
# complementary; test/filters_test.sh asserts every rule name in
# shield_ws.js matches exactly one of the two.
#
# The "banned" rule stays excluded: those lines are enforcement echoes
# (rejected connections from already-banned sources), and feeding them
# back into detection would let a knocking client extend its own ban
# forever. The trailing [^"]+" makes the exclusion cover the whole rule
# name, so a future rule named e.g. "banned-mid-session" is not counted
# by accident.

[Definition]
failregex = js: shield-verdict \{"ts":"[^"]*","src":"<ADDR>","service":"[^"]*","layer":"ws","rule":"(?!banned"|protocol"|malformed"|oversized-message"|oversized-handshake"|binary-frame"|frame-flood"|engine-error")[^"]+"
