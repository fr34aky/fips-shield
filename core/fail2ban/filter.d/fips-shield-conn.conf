# fips-shield: per-node concurrency rejections at the stream stage.
#
# The stream stage writes shield-<svc>.stream.log, which no jail used
# to read — so every limit_conn rejection was logged and then ignored.
# It matters most for the tcp profile, which has no http stage and
# therefore no access log at all.
#
# 503 is nginx's stream limit_conn rejection. Unlike the http module,
# the stream module has no limit_conn_status, so the 429 configured in
# 00-shield-core.conf does not apply here and the status is fixed.
#
# Deliberately NOT matching 403: that is a js_access s.deny(), which
# covers both the connection-rate refusal — already counted by the
# fips-shield-connrate jail, via the verdict line — and the rejection
# of an already-banned source. Counting the latter would let a banned
# node extend its own ban by knocking, the same feedback loop the
# verdict filter excludes the "banned" rule to avoid.
#
# Field order follows the shield_stream_json log_format in
# core/nginx/05-shield-core.stream.template; keep the two in step.

[Definition]
failregex = ^\{"ts":"[^"]*","src":"<ADDR>","service":"[^"]*","status":503,
# Only the timestamp is captured: fail2ban removes group 1
# from the line before applying failregex.
datepattern = ^\{"ts":"({DATE})
