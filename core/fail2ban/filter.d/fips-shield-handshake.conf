# fips-shield: handshake floods / connection-cap hits.
# Matches 429 responses in the http stage's JSON access log
# (limit_req rejections carry "limited":"REJECTED"; limit_conn
# rejections are plain 429s).

[Definition]
failregex = ^\{"ts":"[^"]*","src":"<ADDR>","status":429,
# Only the timestamp is captured: fail2ban removes group 1
# from the line before matching failregex, so capturing the
# JSON prefix too would strip the very text failregex needs.
datepattern = ^\{"ts":"({DATE})
