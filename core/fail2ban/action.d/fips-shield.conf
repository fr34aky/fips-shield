# fips-shield banaction: delegate to the shield-ban backend CLI
# (docs/verdict-schema.md). Swapping the enforcement backend (e.g. the
# Phase 4 eBPF guard) means pointing this at a different binary with
# the same CLI — the jails don't change.

[Definition]
actionstart =
actionstop =
actioncheck =
actionban = /usr/local/bin/shield-ban ban <ip> <bantime>
actionunban = /usr/local/bin/shield-ban unban <ip>
