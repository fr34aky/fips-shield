# fips-shield, split deployment: nginx in a container, detection and
# kernel enforcement on the host.
#
#   cp ../../shield.env.example shield.env   # edit SHIELD_BIND_ADDR etc.
#   docker compose -f compose.split.yaml up -d
#   sudo ../../deploy/host/install.sh shield.env --with-guard
#
# Why this shape: the eBPF guard manipulates host kernel state (a tc
# hook on fips0, maps pinned to the host's bpffs) and fail2ban must be
# able to invoke it, so both belong on the host. nginx is the process
# parsing hostile input, so that is where the container boundary earns
# its keep. See docs/guide.md "Deployment shapes".
#
# The two bind mounts use the same paths inside and out, because the log
# paths are baked into the profile templates AND into the fail2ban jails
# (/var/log/nginx/shield-*), and SHIELD_BAN_FILE defaults under
# /var/lib/fips-shield. Mounting them 1:1 means host fail2ban reads the
# logs and writes the banlist with no config changes on either side.
# /var/log/nginx is free on the host precisely because nginx is in here.
#
# Host networking is required either way: the shield must bind the fips0
# mesh address, which lives on the host. With it, the loopback upstream
# (127.0.0.1:7777) is the host's loopback, so it reaches a service
# running on the host or in a container of its own.
#
# Log rotation becomes the host's job — install
# deploy/host/fips-shield.logrotate, which signals nginx *inside* this
# container. Without it nginx keeps writing to a deleted inode and
# fail2ban goes blind.

services:
  shield:
    build:
      context: ../..
      dockerfile: deploy/container/Dockerfile
    # Fixed name so the logrotate postrotate hook can signal it: compose
    # would otherwise derive it from the project directory
    # (container-shield-1), which the snippet cannot predict.
    container_name: fips-shield
    network_mode: host
    env_file: shield.env
    volumes:
      - /var/log/nginx:/var/log/nginx
      - /var/lib/fips-shield:/var/lib/fips-shield
    restart: unless-stopped

  # No fail2ban sidecar: detection runs on the host, where it can reach
  # fips-guard. Install it with deploy/host/install.sh.
