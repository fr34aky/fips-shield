# fips-shield in front of a strfry relay, container mode.
#
#   cp ../../shield.env.example shield.env   # edit SHIELD_BIND_ADDR etc.
#   docker compose up -d
#
# shield: host networking is required — it must bind the fips0 mesh
# address, which lives on the host (the fips daemon owns the TUN). With
# host networking the loopback upstream (127.0.0.1:7777) is the host's
# loopback, so it reaches a strfry running either on the host or in the
# container below.
#
# fail2ban: detection sidecar. Tails the shield logs (shared volume),
# writes bans to the banlist (shared volume) via shield-ban; nginx
# enforces them. No network, no docker socket.
#
# The sidecar drives the banlist-file backend only. It cannot reach the
# host's bpffs, so the optional eBPF guard is NOT wired to detection in
# this mode — bans are enforced by nginx, and `fips-guard stats` stays
# at zero. For kernel enforcement, run fail2ban on the host instead
# (deploy/host/install-fail2ban.sh); see docs/guide.md section 7.

services:
  shield:
    build:
      context: ../..
      dockerfile: deploy/container/Dockerfile
    network_mode: host
    env_file: shield.env
    volumes:
      - shield-logs:/var/log/nginx
      - shield-bans:/var/lib/fips-shield
    restart: unless-stopped

  fail2ban:
    build:
      context: ../..
      dockerfile: deploy/container/Dockerfile.fail2ban
    network_mode: none
    env_file: shield.env
    volumes:
      - shield-logs:/var/log/nginx
      - shield-bans:/var/lib/fips-shield
    restart: unless-stopped

  # Optional: run strfry itself as a container. Remove if strfry
  # already runs on the host. Host networking + explicit loopback bind
  # keeps it unreachable from the mesh except through the shield.
  #
  # strfry:
  #   image: ghcr.io/hoytech/strfry:latest
  #   network_mode: host
  #   volumes:
  #     - ./strfry.conf:/etc/strfry.conf:ro   # bind = "127.0.0.1", port = 7777
  #     - strfry-db:/app/strfry-db
  #   restart: unless-stopped

volumes:
  shield-logs:
  shield-bans:
#  strfry-db:
